<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skywatch — Live ADS-B</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --accent-2: #FF0000;
  --radius: 20px;
  --radius-sm: 12px;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

html[data-theme="dark"]{
  --bg-0: #000000;
  --bg-1: #0A0A0A;
  --glass-bg: rgba(255,255,255,0.06);
  --glass-bg-strong: rgba(255,255,255,0.11);
  --glass-border: rgba(255,255,255,0.13);
  --glass-highlight: rgba(255,255,255,0.28);
  --text-0: #FFFFFF;
  --text-1: #98989D;
  --text-2: #636366;
  --shadow: 0 8px 32px rgba(0,0,0,0.55);
  --ring-color: rgba(255,255,255,0.13);
  --ring-label: rgba(255,255,255,0.28);
  --accent: #FFFFFF;
  --icon-shadow: 0 1px 3px rgba(0,0,0,0.6);
  --warn-color: #FFB454;
}

html[data-theme="light"]{
  --bg-0: #FFFFFF;
  --bg-1: #F7F7F8;
  --glass-bg: rgba(255,255,255,0.55);
  --glass-bg-strong: rgba(255,255,255,0.8);
  --glass-border: rgba(0,0,0,0.08);
  --glass-highlight: rgba(255,255,255,0.95);
  --text-0: #0A0A0A;
  --text-1: #6E6E73;
  --text-2: #A0A0A5;
  --shadow: 0 8px 28px rgba(0,0,0,0.08);
  --ring-color: rgba(0,0,0,0.08);
  --ring-label: rgba(0,0,0,0.3);
  --accent: #0A0A0A;
  --icon-shadow: 0 1px 2px rgba(0,0,0,0.15);
  --warn-color: #C97418;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; margin:0; overflow:hidden; }
body{
  font-family: var(--font-body);
  background: radial-gradient(120% 120% at 50% 0%, var(--bg-1), var(--bg-0));
  color: var(--text-0);
}

/* ---------- glass base ---------- */
.glass{
  background: var(--glass-bg);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-highlight);
  position: relative;
}
.glass::before{
  content:"";
  position:absolute; inset:0; border-radius: inherit; pointer-events:none;
  background: linear-gradient(155deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 35%);
}

#app{ position:absolute; inset:0; display:flex; flex-direction:column; }

/* ---------- top bar ---------- */
#topbar{
  flex:none; margin:16px 16px 0;
  z-index:1000; display:flex; align-items:center; gap:12px;
  padding:12px 16px;
}
#brand{ display:flex; align-items:center; gap:10px; font-family: var(--font-display); font-weight:700; font-size:17px; letter-spacing:0.2px; white-space:nowrap; }
#brand .dot{
  width:9px; height:9px; border-radius:50%; background:var(--accent-2);
  box-shadow:0 0 8px var(--accent-2);
  animation: pulse 2s ease-in-out infinite;
}
#brand .dot.warn{ background:var(--text-2); box-shadow:none; }
#brand .dot.err{ background:var(--accent-2); box-shadow:0 0 0 2px var(--bg-0), 0 0 6px var(--accent-2); animation:none; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.35} }

#count{
  font-family: var(--font-mono); font-size:13px; color:var(--text-1);
  padding:4px 10px; border-radius:999px; background:var(--glass-bg-strong);
  border:1px solid var(--glass-border);
}
.spacer{ flex:1; }
.iconbtn{
  width:38px; height:38px; border-radius:12px; border:1px solid var(--glass-border);
  background: var(--glass-bg-strong); color:var(--text-0);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition: transform .15s ease, background .15s ease;
  flex:none;
}
.iconbtn:hover{ transform: translateY(-1px); }
.iconbtn svg{ width:18px; height:18px; }

/* ---------- views ---------- */
#views{ flex:1; position:relative; overflow:hidden; }
.view{ position:absolute; inset:0; display:none; overflow:hidden; }
.view.active{ display:flex; flex-direction:column; }

/* ---------- radar ---------- */
#radar-wrap{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; padding:10px; min-height:0; }
#radar-svg{ width:min(92vw, 62vh); height:min(92vw, 62vh); max-width:520px; max-height:520px; }
.ring{ fill:none; stroke:var(--ring-color); stroke-width:1; }
.ring-label{ fill:var(--ring-label); font-family:var(--font-mono); font-size:9px; }
.compass-label{ fill:var(--text-2); font-family:var(--font-display); font-size:12px; font-weight:600; }
.home-dot{ fill:var(--accent-2); }
.plane-node{ cursor:pointer; }
.plane-node .glyph{ fill:var(--accent); transition: transform .5s linear; }
.plane-node.selected .glyph{ fill:var(--accent-2); }
.plane-node.alert .glyph{ fill:var(--accent-2); filter: drop-shadow(0 0 5px rgba(255,0,0,0.55)); }
.plane-node .label{ fill:var(--text-1); font-family:var(--font-mono); font-size:8.5px; }
.radar-ring-pulse{ fill:none; stroke:var(--accent-2); stroke-width:1.2; opacity:0.6; }

/* ---------- nearby list under radar ---------- */
#nearby{ flex:none; max-height:34vh; overflow-y:auto; padding:4px 16px 14px; }
#nearby-title{ font-family:var(--font-display); font-size:12px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:1px; margin:6px 4px 8px; }
.ac-row{
  display:flex; align-items:center; gap:12px; padding:11px 12px; margin:0 0 8px;
  border-radius: var(--radius-sm); cursor:pointer; border:1px solid var(--glass-border);
  transition: background .15s ease, border-color .15s ease;
}
.ac-row.active{ border-color: var(--accent-2); }
.ac-row.active .ac-icon{ color:var(--accent-2); }
.ac-icon{ width:24px; height:24px; flex:none; color:var(--accent); }
.ac-icon svg{ width:100%; height:100%; }
.ac-main{ flex:1; min-width:0; }
.ac-flight{ font-family:var(--font-display); font-weight:600; font-size:14px; }
.ac-sub{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-2); margin-top:2px; }
.ac-nums{ text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--text-1); line-height:1.5; flex:none; }

#empty{ padding:26px 16px; text-align:center; color:var(--text-2); font-size:13px; line-height:1.6; }

/* ---------- hangar ---------- */
#hangar{ flex:1; overflow-y:auto; padding:6px 16px 20px; }
#hangar-title{ display:flex; align-items:baseline; justify-content:space-between; margin:10px 4px 14px; }
#hangar-title h2{ margin:0; font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:1px; }
#hangar-title span{ font-family:var(--font-mono); font-size:12px; color:var(--text-2); }
#hangar-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
@media(min-width:640px){ #hangar-grid{ grid-template-columns: repeat(3, 1fr); } }
@media(min-width:960px){ #hangar-grid{ grid-template-columns: repeat(4, 1fr); } }
.hg-card{ padding:14px; display:flex; flex-direction:column; gap:8px; }
.hg-icon{ width:34px; height:34px; color:var(--accent); }
.hg-icon svg{ width:100%; height:100%; }
.hg-type{ font-family:var(--font-display); font-weight:600; font-size:13.5px; }
.hg-reg{ font-family:var(--font-mono); font-size:11px; color:var(--text-2); }
.hg-meta{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-2); margin-top:auto; padding-top:6px; border-top:1px solid var(--glass-border); }

/* ---------- detail HUD card ---------- */
#overlay-detail{ position:absolute; inset:0; z-index:1100; display:none; align-items:flex-end; justify-content:center; padding:16px; }
#overlay-detail.show{ display:flex; }
#detail{ width:100%; max-width:420px; padding:18px 20px; }
#detail .close{ position:absolute; top:12px; right:12px; }
#detail .flight{ font-family:var(--font-display); font-size:22px; font-weight:700; }
#detail .hexline{ font-family:var(--font-mono); font-size:12px; color:var(--text-2); margin-top:2px; }
.hud-grid{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:14px; margin-top:16px; }
.hud-stat label{ display:block; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-2); margin-bottom:3px; }
.hud-stat .val{ font-family:var(--font-mono); font-size:19px; font-weight:600; color:var(--text-0); }
.hud-stat .val .unit{ font-size:11px; color:var(--text-1); font-weight:400; margin-left:2px; }
.squawk-alert{ color:var(--accent-2) !important; }

/* ---------- bottom tab bar ---------- */
#tabbar{ flex:none; margin:0 16px 16px; padding:8px; display:flex; gap:6px; }
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:9px 0 8px; border-radius:14px; cursor:pointer; color:var(--text-2);
  transition: background .15s ease, color .15s ease;
}
.tab svg{ width:21px; height:21px; }
.tab span{ font-family:var(--font-body); font-size:10.5px; font-weight:600; }
.tab.active{ color:var(--accent-2); background: var(--glass-bg-strong); }

/* ---------- settings modal ---------- */
#overlay{
  position:absolute; inset:0; background:rgba(0,0,0,0.45); z-index:1200;
  display:none; align-items:center; justify-content:center; padding:20px;
}
#overlay.show{ display:flex; }
#settings{ width:100%; max-width:400px; padding:24px; max-height:88vh; overflow-y:auto; }
#settings h3{ margin:0 0 4px; font-family:var(--font-display); font-size:18px; }
#settings p{ margin:0 0 14px; font-size:13px; color:var(--text-1); line-height:1.5; }
#settings label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-2); margin:14px 0 6px; }
#settings input{
  width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--glass-border);
  background: var(--bg-0); color:var(--text-0); font-family:var(--font-mono); font-size:13px;
  outline:none;
}
html[data-theme="light"] #settings input{ background:#fff; }
#settings input:focus{ border-color: var(--accent-2); }
.split{ display:flex; gap:10px; }
.split > div{ flex:1; }
#settings .row{ display:flex; gap:10px; margin-top:20px; }
#settings button{
  flex:1; padding:11px; border-radius:10px; border:none; cursor:pointer;
  font-family:var(--font-body); font-weight:600; font-size:13px;
}
#save-btn{ background:var(--accent-2); color:#FFFFFF; }
#cancel-btn{ background: var(--glass-bg-strong); color:var(--text-0); border:1px solid var(--glass-border) !important; }
</style>
</head>
<body>

<div id="app">
  <div id="topbar" class="glass">
    <div id="brand"><span class="dot" id="status-dot"></span><span>Skywatch</span></div>
    <div id="count">0 aircraft</div>
    <div class="spacer"></div>
    <button class="iconbtn" id="theme-btn" title="Toggle theme"></button>
    <button class="iconbtn" id="settings-btn" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div id="views">
    <div class="view active" id="view-radar">
      <div id="radar-wrap">
        <svg id="radar-svg" viewBox="0 0 300 300"></svg>
      </div>
      <div id="nearby">
        <div id="nearby-title">Nearby</div>
        <div id="list"></div>
      </div>
    </div>

    <div class="view" id="view-hangar">
      <div id="hangar">
        <div id="hangar-title"><h2>Hangar</h2><span id="hangar-count">0 aircraft logged</span></div>
        <div id="hangar-grid"></div>
      </div>
    </div>
  </div>

  <div id="tabbar" class="glass">
    <div class="tab active" data-view="radar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>
      <span>Radar</span>
    </div>
    <div class="tab" data-view="hangar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 16.5 12 4l9 12.5"/><path d="M5 14h14v6H5z"/><path d="M9 20v-3h6v3"/></svg>
      <span>Hangar</span>
    </div>
  </div>
</div>

<div id="overlay-detail">
  <div id="detail" class="glass">
    <button class="iconbtn close" id="detail-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="flight" id="d-flight">—</div>
    <div class="hexline" id="d-hex">—</div>
    <div class="hud-grid">
      <div class="hud-stat"><label>Altitude</label><div class="val" id="d-alt">—</div></div>
      <div class="hud-stat"><label>Speed</label><div class="val" id="d-speed">—</div></div>
      <div class="hud-stat"><label>Heading</label><div class="val" id="d-track">—</div></div>
      <div class="hud-stat"><label>V/S</label><div class="val" id="d-vs">—</div></div>
      <div class="hud-stat"><label>Squawk</label><div class="val" id="d-squawk">—</div></div>
      <div class="hud-stat"><label>Distance</label><div class="val" id="d-dist">—</div></div>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="settings" class="glass">
    <h3>Connect Supabase</h3>
    <p>From Settings → API in your Supabase project. Stays on this device only.</p>
    <label>Project URL</label>
    <input id="in-url" placeholder="https://xxxx.supabase.co" autocomplete="off">
    <label>Anon public key</label>
    <input id="in-key" placeholder="eyJhbGciOi..." autocomplete="off">
    <label>Receiver location</label>
    <div class="split">
      <div><input id="in-lat" placeholder="Latitude" autocomplete="off"></div>
      <div><input id="in-lon" placeholder="Longitude" autocomplete="off"></div>
    </div>
    <div class="row">
      <button id="cancel-btn">Cancel</button>
      <button id="save-btn">Connect</button>
    </div>
    <div style="text-align:center;margin-top:12px;">
      <a href="#" id="auto-theme-link" style="font-size:12px;color:var(--text-2);text-decoration:underline;">Use automatic day/night theme</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const html = document.documentElement;
function autoTheme(){
  const hour = new Date().getHours();
  return (hour >= 6 && hour < 18) ? 'light' : 'dark';
}
const savedTheme = localStorage.getItem('sw-theme') || autoTheme();
html.setAttribute('data-theme', savedTheme);
function themeIcon(){
  document.getElementById('theme-btn').innerHTML = html.getAttribute('data-theme') === 'dark'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>';
}
themeIcon();
document.getElementById('theme-btn').onclick = () => {
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('sw-theme', next);
  themeIcon();
  renderRadar();
};
document.getElementById('auto-theme-link').onclick = (e) => {
  e.preventDefault();
  localStorage.removeItem('sw-theme');
  html.setAttribute('data-theme', autoTheme());
  themeIcon();
  renderRadar();
};

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
    if(tab.dataset.view === 'hangar') loadHangar();
  };
});

let HOME = [
  parseFloat(localStorage.getItem('sw-lat')) || 6.8481,
  parseFloat(localStorage.getItem('sw-lon')) || 79.9265
];
const MAX_RANGE_KM = 150;
const RING_KMS = [50, 100, 150];

function toRad(d){ return d * Math.PI/180; }
function toDeg(r){ return r * 180/Math.PI; }

function distKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function bearing(lat1, lon1, lat2, lon2){
  const dLon = toRad(lon2-lon1);
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
function compassLetter(deg){
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(deg/45) % 8];
}

const TYPE_NAMES = {
  A19N:'Airbus A319neo', A20N:'Airbus A320neo', A21N:'Airbus A321neo',
  A319:'Airbus A319', A320:'Airbus A320', A321:'Airbus A321',
  A332:'Airbus A330-200', A333:'Airbus A330-300', A339:'Airbus A330-900neo',
  A343:'Airbus A340-300', A359:'Airbus A350-900', A35K:'Airbus A350-1000',
  A388:'Airbus A380-800',
  B737:'Boeing 737', B738:'Boeing 737-800', B739:'Boeing 737-900',
  B38M:'Boeing 737 MAX 8', B39M:'Boeing 737 MAX 9', B3XM:'Boeing 737 MAX 10',
  B744:'Boeing 747-400', B748:'Boeing 747-8',
  B772:'Boeing 777-200', B773:'Boeing 777-300', B77W:'Boeing 777-300ER',
  B788:'Boeing 787-8', B789:'Boeing 787-9', B78X:'Boeing 787-10',
  E170:'Embraer E170', E175:'Embraer E175', E190:'Embraer E190', E195:'Embraer E195',
  CRJ9:'Bombardier CRJ900', DH8D:'Dash 8 Q400', AT76:'ATR 72',
};
function typeName(code){ return (code && TYPE_NAMES[code]) || code || null; }

function planeSVG(){
  return `<path class="glyph" d="M12 2 9.5 9 2 12.2v1.8l7.5-2.3.6 5.6L7 19.5V21l5-1.3 5 1.3v-1.5l-3.1-2.2.6-5.6L22 14v-1.8L14.5 9z"/>`;
}
function planeIcon(){
  return `<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 9.5 9 2 12.2v1.8l7.5-2.3.6 5.6L7 19.5V21l5-1.3 5 1.3v-1.5l-3.1-2.2.6-5.6L22 14v-1.8L14.5 9z"/></svg>`;
}

const aircraft = new Map();
let selectedHex = null;

const svgNS = "http://www.w3.org/2000/svg";
const CX = 150, CY = 150, R = 130;

function buildRadarBase(){
  const svg = document.getElementById('radar-svg');
  svg.innerHTML = '';
  RING_KMS.forEach((km, i) => {
    const r = R * (i+1)/RING_KMS.length;
    const c = document.createElementNS(svgNS,'circle');
    c.setAttribute('cx', CX); c.setAttribute('cy', CY); c.setAttribute('r', r);
    c.setAttribute('class','ring');
    svg.appendChild(c);
    const t = document.createElementNS(svgNS,'text');
    t.setAttribute('x', CX+4); t.setAttribute('y', CY - r + 10);
    t.setAttribute('class','ring-label');
    t.textContent = km + 'km';
    svg.appendChild(t);
  });
  [['N',0],['E',90],['S',180],['W',270]].forEach(([label, deg]) => {
    const rad = toRad(deg);
    const x = CX + Math.sin(rad) * (R + 12);
    const y = CY - Math.cos(rad) * (R + 12);
    const t = document.createElementNS(svgNS,'text');
    t.setAttribute('x', x); t.setAttribute('y', y+4);
    t.setAttribute('text-anchor','middle');
    t.setAttribute('class','compass-label');
    t.textContent = label;
    svg.appendChild(t);
  });
  const home = document.createElementNS(svgNS,'circle');
  home.setAttribute('cx', CX); home.setAttribute('cy', CY); home.setAttribute('r', 3.2);
  home.setAttribute('class','home-dot');
  svg.appendChild(home);

  const group = document.createElementNS(svgNS,'g');
  group.setAttribute('id','plane-group');
  svg.appendChild(group);
}

function renderRadar(){
  const group = document.getElementById('plane-group');
  if(!group) return;
  group.innerHTML = '';

  aircraft.forEach(r => {
    const d = distKm(HOME[0], HOME[1], r.lat, r.lon);
    const brg = bearing(HOME[0], HOME[1], r.lat, r.lon);
    const rr = Math.min(d / MAX_RANGE_KM, 1) * R;
    const rad = toRad(brg);
    const x = CX + Math.sin(rad) * rr;
    const y = CY - Math.cos(rad) * rr;
    const alert = ['7500','7600','7700'].includes(r.squawk);

    const node = document.createElementNS(svgNS,'g');
    const isSelected = r.hex === selectedHex;
    node.setAttribute('class', 'plane-node' + (alert?' alert':'') + (isSelected?' selected':''));
    node.setAttribute('transform', `translate(${x},${y})`);
    node.onclick = () => selectAircraft(r.hex);

    if(isSelected){
      const pulse = document.createElementNS(svgNS,'circle');
      pulse.setAttribute('r', 9); pulse.setAttribute('class','radar-ring-pulse');
      node.appendChild(pulse);
    }

    const glyph = document.createElementNS(svgNS,'g');
    glyph.setAttribute('transform', `scale(0.62) translate(-12,-12) rotate(${r.track||0} 12 12)`);
    glyph.innerHTML = planeSVG();
    node.appendChild(glyph);

    const label = document.createElementNS(svgNS,'text');
    label.setAttribute('class','label');
    label.setAttribute('x', 8); label.setAttribute('y', -4);
    label.textContent = r.flight || r.hex.toUpperCase();
    node.appendChild(label);

    group.appendChild(node);
  });
}

function renderList(){
  const list = document.getElementById('list');
  const rows = [...aircraft.values()]
    .map(r => ({...r, _dist: distKm(HOME[0], HOME[1], r.lat, r.lon), _brg: bearing(HOME[0], HOME[1], r.lat, r.lon)}))
    .sort((a,b) => a._dist - b._dist);

  document.getElementById('count').textContent = `${rows.length} aircraft`;

  if(rows.length === 0){
    list.innerHTML = `<div id="empty">No aircraft in range right now.<br>Waiting for data from your receiver…</div>`;
    return;
  }
  list.innerHTML = rows.map(r => `
    <div class="ac-row glass ${r.hex===selectedHex?'active':''}" data-hex="${r.hex}">
      <div class="ac-icon">${planeIcon()}</div>
      <div class="ac-main">
        <div class="ac-flight">${r.flight || r.hex.toUpperCase()}</div>
        <div class="ac-sub">${r._dist.toFixed(0)}km ${compassLetter(r._brg)} · ${r.altitude ?? '—'}ft</div>
      </div>
      <div class="ac-nums">${Math.round(r.speed||0)} kt<br>${Math.round(r.track||0)}°</div>
    </div>
  `).join('');
  list.querySelectorAll('.ac-row').forEach(el => {
    el.onclick = () => selectAircraft(el.dataset.hex);
  });
}

function selectAircraft(hex){
  selectedHex = hex;
  const r = aircraft.get(hex);
  if(!r) return;
  document.getElementById('overlay-detail').classList.add('show');
  document.getElementById('d-flight').textContent = r.flight || 'Unknown';
  document.getElementById('d-hex').textContent = r.hex.toUpperCase();
  document.getElementById('d-alt').innerHTML = `${r.altitude ?? '—'}<span class="unit">ft</span>`;
  document.getElementById('d-speed').innerHTML = `${Math.round(r.speed||0)}<span class="unit">kt</span>`;
  document.getElementById('d-track').innerHTML = `${Math.round(r.track||0)}<span class="unit">°</span>`;
  document.getElementById('d-vs').innerHTML = `${r.vertical_rate ?? 0}<span class="unit">fpm</span>`;
  const sq = document.getElementById('d-squawk');
  sq.textContent = r.squawk || '—';
  sq.classList.toggle('squawk-alert', ['7500','7600','7700'].includes(r.squawk));
  const d = distKm(HOME[0], HOME[1], r.lat, r.lon);
  document.getElementById('d-dist').innerHTML = `${d.toFixed(0)}<span class="unit">km</span>`;
  renderRadar();
  renderList();
}
function closeDetail(){
  selectedHex = null;
  document.getElementById('overlay-detail').classList.remove('show');
  renderRadar();
  renderList();
}
document.getElementById('detail-close').onclick = closeDetail;

let sb = null;
const statusDot = document.getElementById('status-dot');
function setStatus(state){
  statusDot.className = 'dot' + (state==='ok' ? '' : state==='warn' ? ' warn' : ' err');
}

function applyRow(row){
  aircraft.set(row.hex, row);
  if(row.hex === selectedHex) selectAircraft(row.hex);
  renderRadar();
  renderList();
}
function removeRow(hex){
  aircraft.delete(hex);
  if(selectedHex === hex) closeDetail();
  renderRadar();
  renderList();
}

async function connect(){
  const url = localStorage.getItem('sw-url');
  const key = localStorage.getItem('sw-key');
  if(!url || !key){ openSettings(); return; }

  sb = supabase.createClient(url, key);
  setStatus('warn');

  const { data, error } = await sb.from('aircraft_current').select('*');
  if(error){ setStatus('err'); console.error(error); return; }
  data.forEach(applyRow);
  setStatus('ok');

  sb.channel('aircraft-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'aircraft_current' }, payload => {
      if(payload.eventType === 'DELETE'){
        removeRow(payload.old.hex);
      } else {
        applyRow(payload.new);
      }
    })
    .subscribe(status => {
      setStatus(status === 'SUBSCRIBED' ? 'ok' : status === 'CHANNEL_ERROR' ? 'err' : 'warn');
    });
}

async function loadHangar(){
  if(!sb) return;
  const grid = document.getElementById('hangar-grid');
  const { data, error } = await sb.from('aircraft_seen').select('*').order('last_seen', { ascending:false });
  if(error){ console.error(error); return; }
  document.getElementById('hangar-count').textContent = `${data.length} aircraft logged`;
  if(data.length === 0){
    grid.innerHTML = `<div id="empty" style="grid-column:1/-1">Nothing logged yet — once the bridge script has been running a while, every distinct aircraft it hears will show up here.</div>`;
    return;
  }
  grid.innerHTML = data.map(r => `
    <div class="hg-card glass">
      <div class="hg-icon">${planeIcon()}</div>
      <div>
        <div class="hg-type">${typeName(r.type_code) || 'Unknown type'}</div>
        <div class="hg-reg">${r.registration || r.hex.toUpperCase()}</div>
      </div>
      <div class="hg-meta">seen ${r.times_seen}× · first ${new Date(r.first_seen).toLocaleDateString()}</div>
    </div>
  `).join('');
}

function openSettings(){
  document.getElementById('in-url').value = localStorage.getItem('sw-url') || '';
  document.getElementById('in-key').value = localStorage.getItem('sw-key') || '';
  document.getElementById('in-lat').value = HOME[0];
  document.getElementById('in-lon').value = HOME[1];
  document.getElementById('overlay').classList.add('show');
}
function closeSettings(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('settings-btn').onclick = openSettings;
document.getElementById('cancel-btn').onclick = closeSettings;
document.getElementById('save-btn').onclick = () => {
  const url = document.getElementById('in-url').value.trim();
  const key = document.getElementById('in-key').value.trim();
  const lat = parseFloat(document.getElementById('in-lat').value);
  const lon = parseFloat(document.getElementById('in-lon').value);
  if(!url || !key) return;
  localStorage.setItem('sw-url', url);
  localStorage.setItem('sw-key', key);
  if(!isNaN(lat) && !isNaN(lon)){
    HOME = [lat, lon];
    localStorage.setItem('sw-lat', lat);
    localStorage.setItem('sw-lon', lon);
  }
  closeSettings();
  renderRadar();
  renderList();
  connect();
};

buildRadarBase();
connect();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
